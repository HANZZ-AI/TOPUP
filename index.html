<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Slide to Continue</title>
    
    <!-- PWA Meta Tags & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SlideApp">
    <link rel="apple-touch-icon" href="logo.png">
    
    <style>
        /* CSS UNTUK TAMPILAN */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #000000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Box Utama */
        .main-box {
            background-color: #121212;
            width: 90%;
            max-width: 350px;
            padding: 40px 20px;
            border-radius: 20px;
            border: 2px solid #ff0000;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        /* Icon 1:1 */
        .icon-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
        }

        .icon-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .text-guide {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Gimmick Geser (Slider) */
        .slider-container {
            width: 100%;
            height: 60px;
            background-color: #1e1e1e;
            border-radius: 50px;
            position: relative;
            padding: 5px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .slider-text {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 14px;
            z-index: 1;
            pointer-events: none;
            user-select: none;
        }

        .slider-handle {
            width: 50px;
            height: 50px;
            background-color: #ff0000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: absolute;
            left: 5px;
            z-index: 2;
            box-shadow: 0 0 10px #ff0000;
            transition: transform 0.05s linear;
            will-change: transform;
            touch-action: none;
        }

        .slider-handle::after {
            content: '»';
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .slider-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 50px;
            pointer-events: none;
        }
        
        /* Install PWA hint (opsional) */
        .install-hint {
            margin-top: 20px;
            font-size: 10px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <div class="icon-container">
            <img src="icon.png" alt="Icon" id="appIcon">
        </div>

        <div class="text-guide">Geser Untuk Melanjutkan</div>

        <div class="slider-container" id="sliderContainer">
            <div class="slider-text">Geser ke kanan ></div>
            <div class="slider-progress" id="sliderProgress"></div>
            <div class="slider-handle" id="sliderHandle"></div>
        </div>
        <div class="install-hint">Geser Untuk Melanjutkan</div>
    </div>

    <script>
        // ========== SLIDE LOGIC (Touch & Mouse) ==========
        const handle = document.getElementById('sliderHandle');
        const container = document.getElementById('sliderContainer');
        const progress = document.getElementById('sliderProgress');
        
        let isDragging = false;
        let startX = 0;
        let currentTranslate = 0;
        let maxSlide = 0;

        function updateMaxSlide() {
            if (!container || !handle) return 0;
            const containerRect = container.getBoundingClientRect();
            const handleWidth = handle.offsetWidth;
            // Batas maksimal: lebar container - lebar handle - padding kiri/kanan (5px each)
            const max = containerRect.width - handleWidth - 10;
            return max > 0 ? max : 0;
        }

        // Fungsi Mulai Geser (Mouse & Touch)
        const startDrag = (e) => {
            e.preventDefault();
            isDragging = true;
            const clientX = (e.type === 'mousedown') ? e.pageX : e.touches[0].pageX;
            startX = clientX - currentTranslate;
            maxSlide = updateMaxSlide();
        };

        const onDrag = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            
            const clientX = (e.type === 'mousemove') ? e.pageX : e.touches[0].pageX;
            let newTranslate = clientX - startX;
            
            if (newTranslate < 0) newTranslate = 0;
            if (newTranslate > maxSlide) newTranslate = maxSlide;
            
            currentTranslate = newTranslate;
            handle.style.transform = `translateX(${currentTranslate}px)`;
            progress.style.width = `${currentTranslate + 50}px`; // +50 agar progress mengikuti handle

            // Cek jika sudah mencapai 100% (maxSlide)
            if (currentTranslate >= maxSlide && maxSlide > 0) {
                isDragging = false;
                completeSlide();
            }
        };

        const stopDrag = () => {
            if (!isDragging) {
                // Reset jika belum sampai ujung, hanya jika belum complete
                if (currentTranslate > 0 && currentTranslate < maxSlide) {
                    resetSlider();
                }
                return;
            }
            isDragging = false;
            // Jika tidak sampai ujung, balikkan ke posisi awal
            if (currentTranslate < maxSlide) {
                resetSlider();
            }
        };
        
        function resetSlider() {
            currentTranslate = 0;
            handle.style.transform = `translateX(0px)`;
            progress.style.width = `0px`;
        }

        function completeSlide() {
            // Mencegah multiple complete
            if (handle.style.backgroundColor === 'rgb(0, 255, 0)') return;
            
            handle.style.backgroundColor = '#00ff00';
            handle.style.boxShadow = '0 0 20px #00ff00';
            
            setTimeout(() => {
                // Navigasi ke halaman index2.html (atau fallback)
                window.location.href = "index2.html";
            }, 300);
        }

        // Event Listeners Mouse
        handle.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', stopDrag);

        // Event Listeners Touch (HP/Tablet)
        handle.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', onDrag, { passive: false });
        window.addEventListener('touchend', stopDrag);
        
        // Re-calc max slide jika orientasi berubah
        window.addEventListener('resize', () => {
            if (!isDragging) {
                maxSlide = updateMaxSlide();
                resetSlider();
            }
        });
        
        // Inisialisasi maxSlide
        setTimeout(() => {
            maxSlide = updateMaxSlide();
        }, 100);
    </script>
    
    <!-- SERVICE WORKER REGISTRATION (Offline Support) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log('Service Worker registered successfully:', reg.scope);
                }).catch(err => {
                    console.warn('Service Worker registration failed:', err);
                });
            });
        }
        
        // Optional: menampilkan prompt install PWA (browser support)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            // Bisa tampilkan tombol install custom jika ingin, tapi biarkan default browser pun muncul
            console.log('PWA install prompt available');
        });
    </script>
</body>
</html>
